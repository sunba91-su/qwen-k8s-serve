---
- name: Prepare Kubernetes nodes
  hosts: master:workers
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prepare nodes with failure reporting
      block:
        - name: Configure node prerequisites
          ansible.builtin.import_role:
            name: kubernetes_node
      rescue:
        - name: Report node preparation failure
          ansible.builtin.fail:
            msg: "Node preparation failed at {{ ansible_failed_task.name }}. Fix the cause and rerun; no automatic reset is performed."

- name: Bootstrap Kubernetes control plane
  hosts: master
  become: true
  any_errors_fatal: true
  tasks:
    - name: Bootstrap control plane with failure reporting
      block:
        - name: Configure control plane
          ansible.builtin.import_role:
            name: kubernetes_control_plane
      rescue:
        - name: Report control plane failure
          ansible.builtin.fail:
            msg: "Control plane failed at {{ ansible_failed_task.name }}. Inspect journalctl -u kubelet and kubeadm logs before retrying; partial initialization may require manual recovery."

- name: Join Kubernetes workers
  hosts: workers
  become: true
  any_errors_fatal: true
  tasks:
    - name: Join workers with failure reporting
      block:
        - name: Configure worker membership
          ansible.builtin.import_role:
            name: kubernetes_worker
      rescue:
        - name: Report worker failure
          ansible.builtin.fail:
            msg: "Worker join failed at {{ ansible_failed_task.name }}. Inspect journalctl -u kubelet; credentials are intentionally omitted. No automatic reset is performed."
