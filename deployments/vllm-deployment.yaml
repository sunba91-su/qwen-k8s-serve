---

apiVersion: ray.io/v1
kind: RayService
metadata:
  name: qwen-ai-service
  namespace: default
spec:
  serveConfigV2: |
    http_options:
      host: 0.0.0.0
      port: 8000
    applications:
      - name: qwen-app
        import_path: serve_script:deployment
        route_prefix: /
        runtime_env:
          env_vars:
            MODEL_ID: "Qwen/Qwen2.5-0.5B-Instruct"
            SERVED_MODEL_NAME: "Qwen/Qwen2.5-0.5B-Instruct"
            MODEL_DTYPE: "float32"
            MAX_MODEL_LEN: "2048"
            MAX_NUM_SEQS: "16"
            KV_CACHE_GIB: "0.5"
            VLLM_CPU_OMP_THREADS_BIND: "nobind"
            OMP_NUM_THREADS: "3"
        deployments:
          - name: qwen-vllm
            num_replicas: 1
            max_concurrent_queries: 32
            ray_actor_options:
              num_cpus: 3
  serveService:
    metadata:
      name: qwen-ai-service-serve
    spec:
      type: NodePort
      ports:
        - name: serve
          port: 8000
          targetPort: 8000
          nodePort: 30800
  rayClusterConfig:
    rayVersion: "2.9.3"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
        object-store-memory: "268435456"
        metrics-export-port: "8080"
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
          containers:
            - name: ray-head
              image: ghcr.io/sunba91-su/qwen-serve:v0.1.0
              imagePullPolicy: IfNotPresent
              ports:
                - name: gcs
                  containerPort: 6379
                - name: dashboard
                  containerPort: 8265
                - name: client
                  containerPort: 10001
                - name: serve
                  containerPort: 8000
                - name: metrics
                  containerPort: 8080
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 3Gi
    workerGroupSpecs:
      - groupName: vllm-worker
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams:
          num-cpus: "3"
          object-store-memory: "268435456"
          metrics-export-port: "8080"
        template:
          spec:
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        ray.io/node-type: head
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 512Mi
            containers:
              - name: ray-worker
                image: ghcr.io/sunba91-su/qwen-serve:v0.1.0
                imagePullPolicy: IfNotPresent
                ports:
                  - name: metrics
                    containerPort: 8080
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: "3"
                    memory: 7Gi
                  limits:
                    cpu: "3"
                    memory: 7Gi
